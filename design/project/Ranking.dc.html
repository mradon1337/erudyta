<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Erudyta — ranking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BFF}a:hover{color:#2448E0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F9; color: #10162B; font-family: Inter, system-ui, sans-serif; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 24px 20px 100px 20px">

<header style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; letter-spacing: -0.02em">Ranking</h1>
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DDE2EC; color: #10162B; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"></path></svg>
Zaproś
</button>
</header>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #E6E9F0">
<button type="button" onClick="{{ showFriends }}" aria-pressed="{{ friendsOn }}" style="min-height: 44px; border: 0; border-radius: 11px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: {{ friendsBg }}; color: {{ friendsFg }}">Znajomi</button>
<button type="button" onClick="{{ showLeague }}" aria-pressed="{{ leagueOn }}" style="min-height: 44px; border: 0; border-radius: 11px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: {{ leagueBg }}; color: {{ leagueFg }}">Liga tygodnia</button>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-radius: 16px; background: #10162B; color: #FFFFFF">
<span style="font-size: 14px; font-weight: 700">{{ bannerTitle }}</span>
<span style="font-size: 13px">{{ bannerSub }}</span>
</div>

<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ rows }}" as="row" hint-placeholder-count="7">
<li style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border-radius: 16px; box-sizing: border-box; background: {{ row.bg }}; border: 2px solid {{ row.border }}">
<span style="width: 22px; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 16px; font-weight: 700; text-align: center; color: {{ row.rankColor }}">{{ row.rank }}</span>
<span style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; flex-shrink: 0; border-radius: 999px; font-size: 14px; font-weight: 700; background: {{ row.avBg }}; color: {{ row.avFg }}">{{ row.initials }}</span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">{{ row.name }}</span><span style="font-size: 12px; color: #5B6478">{{ row.meta }}</span></span>
<span style="font-size: 15px; font-weight: 700">{{ row.xp }} XP</span>
</li>
</sc-for>
</ol>

<section style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: #FFEBDD">
<div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 17px; font-weight: 700">Pojedynek z Kasią</span>
<span style="font-size: 13px; line-height: 1.4; color: #3A4256">5 pytań na żywo. Kto szybciej i lepiej, ten bierze 50 XP.</span>
</div>
<a href="Quiz.dc.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 18px; border-radius: 14px; background: #10162B; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none">Wyzwij</a>
</section>

</div>

<nav aria-label="Główna nawigacja" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; padding-bottom: 10px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #DDE2EC; display: flex; justify-content: space-around; align-items: center">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 80px; min-height: 52px; color: #5B6478; font-size: 12px; font-weight: 600; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Start</a>
<a href="Powtorki.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 80px; min-height: 52px; color: #5B6478; font-size: 12px; font-weight: 600; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"></path><path d="M3 11V9a3 3 0 0 1 3-3h15"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v2a3 3 0 0 1-3 3H3"></path></svg>Powtórki</a>
<a href="Ranking.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 80px; min-height: 52px; color: #2F5BFF; font-size: 12px; font-weight: 700; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg>Ranking</a>
<a href="Profil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 80px; min-height: 52px; color: #5B6478; font-size: 12px; font-weight: 600; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Profil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var FRIENDS = [
  { name: 'Kasia', initials: 'K', meta: 'seria 31 dni', xp: '1 240' },
  { name: 'Ty', initials: 'TY', meta: 'seria 13 dni', xp: '1 180', me: true },
  { name: 'Marek', initials: 'M', meta: 'seria 4 dni', xp: '1 090' },
  { name: 'Ola', initials: 'O', meta: 'seria 9 dni', xp: '860' },
  { name: 'Tomek', initials: 'T', meta: 'seria 2 dni', xp: '710' },
  { name: 'Ania', initials: 'A', meta: 'seria 1 dzień', xp: '540' }
];
var LEAGUE = [
  { name: 'wiedzmin_88', initials: 'W', meta: 'awans', xp: '2 410' },
  { name: 'Basia K.', initials: 'B', meta: 'awans', xp: '2 120' },
  { name: 'Ty', initials: 'TY', meta: 'awans', xp: '1 180', me: true },
  { name: 'Piotr_quiz', initials: 'P', meta: 'awans', xp: '1 150' },
  { name: 'Zuza', initials: 'Z', meta: 'awans', xp: '1 020' },
  { name: 'Grzegorz', initials: 'G', meta: 'strefa bezpieczna', xp: '980' }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'friends' };
  }

  renderVals() {
    var self = this;
    var friends = this.state.tab === 'friends';
    var list = friends ? FRIENDS : LEAGUE;
    var rows = list.map(function (p, idx) {
      var top = idx < 3;
      return {
        rank: idx + 1, name: p.name, initials: p.initials, meta: p.meta, xp: p.xp,
        bg: p.me ? '#E5EBFF' : '#FFFFFF',
        border: p.me ? '#2F5BFF' : '#DDE2EC',
        rankColor: top ? '#B13A08' : '#5B6478',
        avBg: p.me ? '#2F5BFF' : '#10162B',
        avFg: '#FFFFFF'
      };
    });
    return {
      rows: rows,
      friendsOn: friends ? 'true' : 'false',
      leagueOn: friends ? 'false' : 'true',
      friendsBg: friends ? '#FFFFFF' : 'transparent',
      friendsFg: friends ? '#10162B' : '#3A4256',
      leagueBg: friends ? 'transparent' : '#FFFFFF',
      leagueFg: friends ? '#3A4256' : '#10162B',
      bannerTitle: friends ? 'Ten tydzień · znajomi' : 'Liga Srebrna',
      bannerSub: friends ? 'reset w poniedziałek' : 'top 5 awansuje · 2 dni',
      showFriends: function () { self.setState({ tab: 'friends' }); },
      showLeague: function () { self.setState({ tab: 'league' }); }
    };
  }
}
</script>
</body>
</html>
